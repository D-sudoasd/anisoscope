name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run static checks
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine check-manifest check-wheel-contents cffconvert
      - name: Validate repository metadata
        run: |
          check-manifest
          cffconvert --validate
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed wheel
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
          QT_QPA_PLATFORM: offscreen
        run: |
          .wheel-venv/bin/python -c "import anisoscope, crystal_elastic_workbench; print(anisoscope.__version__)"
          .wheel-venv/bin/python -c "from importlib.metadata import entry_points; from crystal_elastic_workbench.gui import main; entries = {entry.name: entry.value for entry in entry_points(group='console_scripts')}; assert entries['anisoscope'] == 'crystal_elastic_workbench.gui:main'; assert entries['crystal-elastic-workbench'] == 'crystal_elastic_workbench.gui:main'; print(main.__name__)"
          mkdir wheel-smoke-output
          cd wheel-smoke-output
          ../.wheel-venv/bin/python ../examples/minimal_analysis.py --help
          ../.wheel-venv/bin/python ../examples/minimal_analysis.py --output results
