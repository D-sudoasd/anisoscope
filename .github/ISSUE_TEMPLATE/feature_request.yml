name: Feature request
description: Propose a focused, research-relevant improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Research or maintenance need
      description: Describe the workflow gap and intended users.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, scientific assumptions, and error boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: List related tools or workarounds and why they do not meet this need.
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: Suggest analytic cases, reference data, or tests that could establish correctness.
