[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anisoscope"
version = "0.1.0"
description = "AnisoScope: GUI and numerical toolkit for crystal elastic anisotropy analysis from Cij."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Delun Gong" },
]
keywords = [
    "elastic tensor",
    "elastic anisotropy",
    "materials science",
    "scientific visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "pyvista>=0.43",
    "vtk>=9.2",
    "PySide6>=6.6",
    "imageio>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/D-sudoasd/anisoscope"
Repository = "https://github.com/D-sudoasd/anisoscope"
Issues = "https://github.com/D-sudoasd/anisoscope/issues"
Documentation = "https://github.com/D-sudoasd/anisoscope#readme"

[project.scripts]
anisoscope = "crystal_elastic_workbench.gui:main"
crystal-elastic-workbench = "crystal_elastic_workbench.gui:main"

[tool.setuptools.packages.find]
include = ["anisoscope*", "crystal_elastic_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# Keep the CI lint contract explicit. Ruff 0.16 expanded its implicit default
# from 59 to 413 rules; relying on that moving default made identical source
# pass locally with 0.15 and fail after a fresh CI install.
select = ["E4", "E7", "E9", "F"]

[tool.check-manifest]
ignore = [
    "paper/**",
]

[tool.check-wheel-contents]
# Both names are intentional: anisoscope is the public project-name package,
# while crystal_elastic_workbench remains the implementation and legacy API.
toplevel = ["anisoscope", "crystal_elastic_workbench"]
