<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AnisoScope</title>
  <desc id="desc">AnisoScope analyses a supplied stiffness matrix through separate stability diagnostics and compliance-based elastic calculations, then writes traceable outputs.</desc>

  <rect width="1200" height="400" rx="18" fill="#F7F6F2"/>
  <path d="M0 58H1200" stroke="#D6D8D6"/>
  <path d="M0 399H1200" stroke="#2F6678" stroke-width="2"/>

  <g transform="translate(54 38)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text fill="#68777D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="2">CRYSTAL ELASTICITY · DESKTOP + PYTHON</text>
    <text y="102" fill="#202A30" font-size="64" font-weight="700" letter-spacing="-1.5">AnisoScope</text>
    <text y="150" fill="#36454C" font-size="21">Crystal elastic anisotropy from an explicit Cij tensor.</text>
    <path d="M0 184H525" stroke="#B7C0C3"/>
    <text y="224" fill="#B47B3C" font-size="21" font-weight="650">Cij 6 × 6</text>
    <text x="112" y="224" fill="#68777D" font-size="20">GPa · engineering shear · declared crystal system</text>
    <text y="266" fill="#2F6678" font-size="21" font-weight="650">Traceable analysis</text>
    <text y="300" fill="#68777D" font-size="19">diagnostics · VRH · directional sampling · export sidecars</text>
  </g>

  <g transform="translate(640 78)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="0" y="0" fill="#B47B3C" font-size="30" font-weight="700">Supplied Cij</text>

    <g transform="translate(0 36)">
      <rect width="120" height="120" fill="#FFFFFF" stroke="#202A30" stroke-width="1.5"/>
      <g stroke="#B7C0C3">
        <path d="M20 0V120M40 0V120M60 0V120M80 0V120M100 0V120"/>
        <path d="M0 20H120M0 40H120M0 60H120M0 80H120M0 100H120"/>
      </g>
      <path d="M0 0L120 120" stroke="#B47B3C" stroke-width="2" opacity="0.65"/>
    </g>

    <path d="M130 69H168" fill="none" stroke="#68777D" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M160 63L170 69L160 75" fill="none" stroke="#68777D" stroke-width="2"/>
    <text x="178" y="63" fill="#202A30" font-size="30" font-weight="650">Diagnostics</text>
    <text x="178" y="87" fill="#68777D" font-size="18">stability checks</text>

    <path d="M130 128H168" stroke="#2F6678" stroke-width="2"/>
    <path d="M160 122L170 128L160 134" fill="none" stroke="#2F6678" stroke-width="2"/>
    <text x="134" y="117" fill="#68777D" font-size="17">invert</text>
    <text x="178" y="130" fill="#2F6678" font-size="28" font-weight="700">Elastic response</text>
    <text x="178" y="154" fill="#68777D" font-size="18">VRH · directions</text>

    <path d="M350 69H392V96H414M384 90L394 96L384 102" fill="none" stroke="#9EACB1" stroke-width="1.5"/>
    <path d="M384 128H414" fill="none" stroke="#2F6678" stroke-width="2"/>
    <path d="M406 122L416 128L406 134" fill="none" stroke="#2F6678" stroke-width="2"/>
    <rect x="422" y="76" width="128" height="74" fill="#E8F0F2"/>
    <text x="486" y="106" text-anchor="middle" fill="#2F6678" font-size="25" font-weight="700">Traceable</text>
    <text x="486" y="135" text-anchor="middle" fill="#2F6678" font-size="25" font-weight="700">outputs</text>
  </g>

  <text x="1146" y="376" text-anchor="end" fill="#68777D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">D-sudoasd / anisoscope</text>
</svg>
